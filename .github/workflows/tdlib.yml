name: Build TDLib
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tdlib:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TD_COMMIT: 4c6377aa7386c39217878a9a56d581922ad37ca4
      NDK_VERSION: 26.1.10909125
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gperf php-cli ninja-build zip
      - name: Install SDK pieces
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;$NDK_VERSION" "cmake;3.22.1" "platforms;android-34"
      - name: Fetch TDLib
        run: |
          mkdir td && cd td && git init -q
          git remote add origin https://github.com/tdlib/td
          git fetch -q --depth 1 origin "$TD_COMMIT"
          git checkout -q FETCH_HEAD
      - name: Build OpenSSL
        working-directory: td/example/android
        run: ./build-openssl.sh "$ANDROID_HOME" "$NDK_VERSION" third-party/openssl OpenSSL_1_1_1w
      - name: Build TDLib
        working-directory: td/example/android
        run: ./build-tdlib.sh "$ANDROID_HOME" "$NDK_VERSION" third-party/openssl c++_static Java 21 "arm64-v8a armeabi-v7a"
      - name: Package
        working-directory: td/example/android
        run: |
          STRIP="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          for f in tdlib/libs/*/libtdjni.so; do "$STRIP" --strip-unneeded "$f"; done
          ls -la tdlib/libs/*/
          (cd tdlib/libs && zip -r "$GITHUB_WORKSPACE/tdlib-libs.zip" .)
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/java/org/drinkless/tdlib"
          cp tdlib/java/org/drinkless/tdlib/*.java "$GITHUB_WORKSPACE/app/src/main/java/org/drinkless/tdlib/"
      - name: Publish libs release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tdlib-libs --yes --cleanup-tag || true
          gh release create tdlib-libs tdlib-libs.zip --title "TDLib native libs" --notes "TDLib ${TD_COMMIT}"
      - name: Commit Java bindings
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add app/src/main/java/org/drinkless
          git commit -m "Add TDLib Java bindings (${TD_COMMIT::7})" || echo "no changes"
          git pull --rebase origin main
          git push origin HEAD:main
